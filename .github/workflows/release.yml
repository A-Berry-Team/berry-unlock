name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64 zip
      - run: cargo test --lib
      - run: ./scripts/build.sh
      - run: ./scripts/verify.sh
      - run: ./scripts/package.sh
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/berry_unlock.exe
            dist/berry_unlock.exe.sha256
            dist/berry_unlock-*-x86_64-windows.zip
